name: Deploy em Produção

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  secret-scan:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.CODDY_AUTO_DEPLOY_ENABLED == 'true') }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout all refs
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan Git history and current tree with pinned Gitleaks
        run: |
          docker run --rm \
            --mount type=bind,source="$PWD",target=/repo,readonly \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --log-opts="--all" --redact=100

  build-image:
    if: ${{ github.ref == 'refs/heads/main' && needs.secret-scan.result == 'success' }}
    needs: secret-scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/brafurries/brafurries-discord:${{ github.sha }}

      - name: Verify image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$DIGEST" \
            | grep -Eq '^sha256:[a-f0-9]{64}$'
          then
            echo "Invalid or missing image digest"
            exit 1
          fi

          echo "Immutable image built successfully."


  deploy-production:
    if: ${{ github.ref == 'refs/heads/main' && needs.build-image.result == 'success' }}
    needs: build-image

    runs-on:
      group: coddy-production
      labels: [self-hosted, BRFD]

    concurrency:
      group: brafurries-coddy-production-deploy
      cancel-in-progress: false

    environment:
      name: Produção

    permissions:
      contents: read
      packages: read

    steps:
      - name: Reject stale main revision
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          CURRENT_SHA="$(
            curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPOSITORY}/git/ref/heads/main" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])'
          )"

          if [[ "$CURRENT_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Refusing stale deployment: main has advanced." >&2
            exit 1
          fi

      - name: Stage production environment
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          set -euo pipefail

          if [[ -z "${PROD_ENV_FILE:-}" ]]; then
            echo "PROD_ENV_FILE is missing or empty"
            exit 1
          fi

          printf '%s\n' "$PROD_ENV_FILE" \
            | sudo -n /usr/local/sbin/update-brafurries-coddy-env stage

          sudo -n /usr/local/sbin/update-brafurries-coddy-env status

      - name: Deploy immutable image
        env:
          DIGEST: ${{ needs.build-image.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/brafurries/brafurries-discord@${DIGEST}"

          if ! printf '%s' "$IMAGE" \
            | grep -Eq '^ghcr\.io/brafurries/brafurries-discord@sha256:[a-f0-9]{64}$'
          then
            echo "Invalid immutable image reference"
            exit 1
          fi

          printf '%s' "$GHCR_TOKEN" \
            | sudo -n /usr/local/sbin/deploy-brafurries-coddy \
                deploy \
                "$IMAGE" \
                "$GHCR_USER"

      - name: Validate liveness
        run: curl -fsS http://127.0.0.1:18088/live >/dev/null

      - name: Validate readiness
        run: curl -fsS http://127.0.0.1:18088/ready >/dev/null

      - name: Record final status
        run: sudo -n /usr/local/sbin/deploy-brafurries-coddy status
