name: PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all refs
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan Git history and current tree with pinned Gitleaks
        run: |
          docker run --rm \
            --mount type=bind,source="$PWD",target=/repo,readonly \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --log-opts="--all" --redact=100

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q cogs core message_services schemas

      - name: Run tests
        run: python -m pytest

      - name: Checkout pinned Database baseline (read only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: BraFurries/BraFurries-Database
          ref: 0df5070079d26d18752282c642a9ff10037c8bfb
          path: .ci/database-baseline
          persist-credentials: false

      - name: Validate Coddy startup schema preflights on disposable MariaDB
        env:
          BRF_DISPOSABLE_SCHEMA_COMPAT: "true"
        run: |
          set -euo pipefail
          test "$(git -C .ci/database-baseline rev-parse HEAD)" = "0df5070079d26d18752282c642a9ff10037c8bfb"
          test "$(grep -c '^CREATE TABLE ' .ci/database-baseline/flyway/sql/baseline/B20261020_001__adopt_production_schema.sql)" -eq 107
          python -m pytest -q tests/test_disposable_database_baseline_contract.py
